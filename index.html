<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      (function () {
        try {
          const stored = localStorage.getItem('rn-group-theme');
          if (stored === 'dark') document.documentElement.classList.add('dark');
          else if (stored === 'light') document.documentElement.classList.add('light');
          else document.documentElement.classList.add('light');
          const lang = localStorage.getItem('rn-group-lang');
          if (lang === 'bn') document.documentElement.setAttribute('lang', 'bn');
        } catch (e) {}
      })();
    </script>
    <title>RN Group - Fire Safety Equipment &amp; Solution</title>
    <meta name="description" content="RN Group Fire Safety Equipment & Solution - Fire Protection System product catalog page mockup with 21 numbered products grid, composite hero flame/hexagon banner, breadcrumbs, and corporate footer." />

    <meta property="og:description" content="RN Group Fire Safety Equipment & Solution - Fire Protection System product catalog page mockup with 21 numbered products grid, composite hero flame/hexagon banner, breadcrumbs, and corporate footer." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</html>
